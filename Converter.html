<body>
    <h1>Temperature Converter</h1>

    <div class="input">
        <label for="tempInput">Enter Temperature:</label>
        <input type="number" id="tempInput" placeholder="Enter value" oninput="convertTemperature()">
        
        <label for="tempUnit" style="margin-top: 1rem;">From Unit:</label>
        <select id="tempUnit" onchange="convertTemperature()" style="padding: 0.5rem; font-size: 1rem; border-radius: 4px; width: 215px;">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>
    </div>
    <div id="converterOutput" style="text-align: center; margin-top: 2rem; font-size: 1.3rem; line-height: 2rem;">
    </div>
